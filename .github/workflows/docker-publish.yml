name: Build and publish Docker image

# Builds the bot's image and pushes it to GHCR. Komodo then just pulls
# ghcr.io/<owner>/tvbot:latest (with poll_for_updates/auto_update) instead of
# building on the deployment server itself.

on:
  push:
    branches: [main, feat/music]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tvbot:latest
            ghcr.io/${{ github.repository_owner }}/tvbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
